<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Corte & Estilo</title>
    <!-- ✅ Caminho CERTO -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>CADASTRO</h1>
        <a href="login.html" class="voltar">← Voltar</a>
    </header>

    <main>
        <form id="form-cadastro">
            <label>Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Seu nome">

            <label>E-mail:</label>
            <input type="email" id="email" required placeholder="seu@email.com">

            <label>Telefone:</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000">

            <label>Senha:</label>
            <input type="password" id="senha" required placeholder="Crie uma senha">

            <button type="submit" class="btn">Cadastrar</button>
            
            <p>Já tem conta? <a href="login.html">Entrar</a></p>
        </form>
    </main>

    <!-- ✅ Caminho CERTO -->
    <script src="../app.js"></script>
</body>
</html>
