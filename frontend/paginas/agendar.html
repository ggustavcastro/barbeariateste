<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Atendimento - Corte & Estilo</title>
    <!-- ✅ Caminho CERTO (usa ../ para voltar uma pasta) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AGENDAR ATENDIMENTO</h1>
        <a href="../index.html" class="voltar">← Voltar</a>
    </header>

    <main>
        <form id="form-agendamento">
            <label>Seu Nome:</label>
            <input type="text" id="nome" required placeholder="Digite seu nome">

            <label>Telefone:</label>
            <input type="tel" id="telefone" required placeholder="(00) 00000-0000">

            <label>Procedimento:</label>
            <select id="servico" required>
                <option value="">Carregando serviços...</option>
            </select>

            <label>Data:</label>
            <input type="date" id="data" required>

            <label>Horário de Início:</label>
            <select id="horario" required>
                <option value="">Selecione um horário...</option>
            </select>

            <button type="submit" class="btn">Confirmar Agendamento</button>
        </form>
    </main>

    <!-- ✅ Caminho CERTO -->
    <script src="../app.js"></script>
</body>
</html>
